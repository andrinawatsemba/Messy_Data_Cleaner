<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="spongeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="spongeScrub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Big Cheerful Mascot: Friendly Spray Bottle + Sponge Buddy -->

  <!-- Spray Mist Effect -->
  <g opacity="0.85">
    <circle cx="106" cy="24" r="3.5" fill="#38bdf8" />
    <circle cx="118" cy="20" r="2.5" fill="#38bdf8" />
    <circle cx="114" cy="30" r="4.5" fill="#7dd3fc" />
    <circle cx="126" cy="26" r="3" fill="#bae6fd" />
    <path d="M 94,32 Q 108,24 122,26" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.6" />
  </g>

  <!-- Bottle Shadow -->
  <ellipse cx="65" cy="126" rx="35" ry="8" fill="#1e2923" opacity="0.12" />

  <!-- Sponge Companion sitting on the side -->
  <g transform="translate(18, 86)">
    <!-- Scrubbing Layer -->
    <rect x="0" y="16" width="36" height="8" rx="2" fill="url(#spongeScrub)" />
    <!-- Yellow Sponge Layer -->
    <rect x="0" y="0" width="36" height="17" rx="4" fill="url(#spongeGrad)" />
    <!-- Sponge Holes -->
    <circle cx="8" cy="6" r="1.5" fill="#d97706" opacity="0.6" />
    <circle cx="16" cy="11" r="2" fill="#d97706" opacity="0.6" />
    <circle cx="27" cy="6" r="1.5" fill="#d97706" opacity="0.6" />
    <!-- Cute Eyes on Sponge -->
    <circle cx="12" cy="7" r="2" fill="#1f2937" />
    <circle cx="22" cy="7" r="2" fill="#1f2937" />
    <circle cx="13" cy="6" r="0.7" fill="#ffffff" />
    <circle cx="23" cy="6" r="0.7" fill="#ffffff" />
    <path d="M 15,10 Q 17,12 19,10" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Spray Bottle Main Body -->
  <g filter="url(#softShadow)">
    <!-- Main Bottle Body -->
    <path d="M 50,56 L 82,56 C 88,56 94,62 92,72 L 86,112 C 85,118 79,122 73,122 L 59,122 C 53,122 47,118 46,112 L 40,72 C 38,62 44,56 50,56 Z" fill="url(#bottleGrad)" />

    <!-- Water Level Indicator Ribbon -->
    <path d="M 43,84 Q 66,90 89,84 L 86,112 C 85,118 79,122 73,122 L 59,122 C 53,122 47,118 46,112 Z" fill="#0284c7" opacity="0.35" />

    <!-- Bottle Neck & Collar -->
    <rect x="58" y="42" width="16" height="16" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <rect x="55" y="54" width="22" height="6" rx="3" fill="#f59e0b" />

    <!-- Spray Trigger Head -->
    <path d="M 50,26 L 82,26 C 86,26 90,29 90,34 L 90,44 L 56,44 L 56,34 C 56,29 60,26 50,26 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Trigger Lever -->
    <path d="M 52,36 C 44,39 41,47 46,54 C 48,55 51,53 51,48 L 57,40 Z" fill="#0284c7" />

    <!-- Nozzle Tip -->
    <rect x="89" y="30" width="11" height="9" rx="2.5" fill="#f59e0b" />
    <circle cx="98" cy="34.5" r="2" fill="#b45309" />

    <!-- Friendly Expressive Eyes -->
    <circle cx="58" cy="76" r="5" fill="#ffffff" />
    <circle cx="60" cy="76" r="3" fill="#0f172a" />
    <circle cx="61" cy="75" r="1.2" fill="#ffffff" />

    <circle cx="74" cy="76" r="5" fill="#ffffff" />
    <circle cx="74" cy="76" r="3" fill="#0f172a" />
    <circle cx="75" cy="75" r="1.2" fill="#ffffff" />

    <!-- Cute Cheeks -->
    <ellipse cx="53" cy="83" rx="3.5" ry="2" fill="#f43f5e" opacity="0.5" />
    <ellipse cx="79" cy="83" rx="3.5" ry="2" fill="#f43f5e" opacity="0.5" />

    <!-- Cheerful Smile -->
    <path d="M 61,85 Q 66,91 71,85" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Big Cheerful Sparkles -->
  <path d="M 104,50 L 107,42 L 110,50 L 118,53 L 110,56 L 107,64 L 104,56 L 96,53 Z" fill="#fbbf24" />
  <path d="M 32,46 L 34,40 L 36,46 L 42,48 L 36,50 L 34,56 L 32,50 L 26,48 Z" fill="#10b981" />
  <circle cx="112" cy="75" r="3" fill="#38bdf8" />
</svg>
