<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4aa3cc" />
      <stop offset="100%" stop-color="#2c7a9e" />
    </linearGradient>
    <linearGradient id="nozzleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Bottle Body -->
  <path d="M 38,40 L 62,40 C 66,40 70,44 68,52 L 64,84 C 63,88 59,90 55,90 L 45,90 C 41,90 37,88 36,84 L 32,52 C 30,44 34,40 38,40 Z" fill="url(#bottleGrad)" filter="url(#shadow)" />

  <!-- Bottle Neck & Collar -->
  <rect x="44" y="28" width="12" height="13" rx="2" fill="#e2ede6" stroke="#2c7a9e" stroke-width="1.5" />
  <rect x="42" y="38" width="16" height="4" rx="2" fill="#f59e0b" />

  <!-- Spray Trigger Mechanism -->
  <path d="M 40,16 L 60,16 C 63,16 66,18 66,22 L 66,28 L 44,28 L 44,22 C 44,18 47,16 40,16 Z" fill="url(#nozzleGrad)" />
  <!-- Trigger Handle -->
  <path d="M 40,24 C 34,26 31,31 34,36 C 36,37 38,36 39,32 L 44,26 Z" fill="#2c7a9e" />
  <!-- Nozzle Tip -->
  <rect x="65" y="19" width="7" height="6" rx="1.5" fill="#f59e0b" />

  <!-- Face -->
  <!-- Eyes -->
  <circle cx="45" cy="56" r="3.5" fill="#ffffff" />
  <circle cx="46" cy="56" r="2" fill="#1a2923" />
  <circle cx="47" cy="55" r="0.8" fill="#ffffff" />

  <circle cx="55" cy="56" r="3.5" fill="#ffffff" />
  <circle cx="56" cy="56" r="2" fill="#1a2923" />
  <circle cx="57" cy="55" r="0.8" fill="#ffffff" />

  <!-- Rosy Cheeks -->
  <ellipse cx="41" cy="61" rx="2.5" ry="1.5" fill="#f472b6" opacity="0.6" />
  <ellipse cx="59" cy="61" rx="2.5" ry="1.5" fill="#f472b6" opacity="0.6" />

  <!-- Happy Smile -->
  <path d="M 47,63 Q 50,67 53,63" fill="none" stroke="#1a2923" stroke-width="1.8" stroke-linecap="round" />

  <!-- Sparkles -->
  <path d="M 76,14 L 78,8 L 80,14 L 86,16 L 80,18 L 78,24 L 76,18 L 70,16 Z" fill="#f59e0b" />
  <path d="M 22,34 L 23,30 L 25,34 L 29,35 L 25,36 L 23,40 L 22,36 L 18,35 Z" fill="#10b981" />
